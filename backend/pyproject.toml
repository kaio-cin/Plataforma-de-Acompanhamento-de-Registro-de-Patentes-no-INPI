[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Cobertura (Sprint 3): escopo restrito aos módulos das user stories selecionadas
# (US01, US02, US03, US04, US06, US07). Rodar, por exemplo:
#   pytest tests/v1-llm --cov --cov-branch --cov-report=term-missing
[tool.coverage.run]
branch = true
source = ["app"]
# Fora do escopo: configuração, infraestrutura de banco, models declarativos, seed e health.
# Ficam medidos: core/security, routes (auth, assets, deps), schemas e services.
omit = [
    "app/core/config.py",
    "app/database/*",
    "app/models/*",
    "app/main.py",
    "app/seed.py",
    "app/routes/health.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
